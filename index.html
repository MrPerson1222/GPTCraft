const vrRays=[];for(let i=0;i<2;i++){const controller=renderer.xr.getController(i);vrRig.add(controller);const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-2)]),new THREE.LineBasicMaterial({color:0x66ddff,depthTest:false}));line.renderOrder=22;controller.add(line);vrRays.push({controller,line});controller.addEventListener("selectstart",()=>{if(!vrActive||!gameStarted)return;rayMatrix.identity().extractRotation(controller.matrixWorld);raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);raycaster.ray.direction.set(0,0,-1).applyMatrix4(rayMatrix);const hits=raycaster.intersectObjects(vrButtons.filter(b=>b.mesh.visible).map(b=>b.mesh),false);if(hits.length){const item=vrButtons.find(b=>b.mesh===hits[0].object);item?.action()}})}

const ambient=new THREE.HemisphereLight(0xffffff,0x445577,2);scene.add(ambient);

function caveKey(x,z){return Math.floor(x/CHUNK)+','+Math.floor(z/CHUNK)}

function makeCave(){caveGroup=new THREE.Group();scene.add(caveGroup);const mat=(color)=>new THREE.MeshLambertMaterial({color,side:THREE.DoubleSide});const stone=mat(0x41424a),floor=new THREE.Mesh(new THREE.BoxGeometry(28,1,28),stone);floor.position.y=-.5;caveGroup.add(floor);for(const [x,z,w,d] of [[0,-14,28,1],[0,14,28,1],[-14,0,1,28],[14,0,1,28]]){const wall=new THREE.Mesh(new THREE.BoxGeometry(w,9,d),stone);wall.position.set(x,4,z);caveGroup.add(wall)}const roof=new THREE.Mesh(new THREE.BoxGeometry(28,1,28),stone);roof.position.y=9;caveGroup.add(roof);const lamp=new THREE.PointLight(0x9fb9ff,1.7,26);lamp.position.set(0,7,0);caveGroup.add(lamp);

function enterCave(){if(caveMode)return;const pos=playerPosition(),entrance=caveEntranceAt(pos.x,pos.z);if(!entrance){notify('Find a dark cave entrance on a mountain');return}caveOrigin={x:pos.x,z:pos.z};caveId=entrance.id;caveMode=true;makeCave();camera.position.set(0,1.7,10);vrRig.position.set(0,0,10);for(const m of terrainChunks.values()){m.visible=false;m.userData.rocks.visible=false;m.userData.trees.visible=false;m.userData.water.visible=false}for(const a of animals)a.mesh.visible=false;notify('🕳 Entered mountain cave! Beware monsters')}

const CHUNK=32,GRID=12,ACTIVE_RADIUS=1,terrainChunks=new Map();const WATER_LEVEL=-1.4;let hasStonePickaxe=false,hasIronPickaxe=false;const choppedTrees=new Set();

const waterMat=new THREE.MeshLambertMaterial({color:0x217fb2,transparent:true,opacity:.65,side:THREE.DoubleSide,depthWrite:false});const trunkMat=new THREE.MeshLambertMaterial({color:0x79502c}),leafMat=new THREE.MeshLambertMaterial({color:0x347c39});const trunkGeo=new THREE.CylinderGeometry(.22,.3,2.4,5),leafGeo=new THREE.ConeGeometry(1.4,3.2,6);

 for(let i=0;i<18;i++){const rx=(cx+(hash2(cx*37+i*7,cz*19+i*11)-.5))*CHUNK,rz=(cz+(hash2(cx*13+i*17,cz*41+i*5)-.5))*CHUNK;

 }

function addShelter(x,z){const g=new THREE.Group(),wood=new THREE.MeshLambertMaterial({color:0x85502d});for(const [px,pz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){const post=new THREE.Mesh(new THREE.BoxGeometry(.18,2,.18),wood);post.position.set(px,1,pz);g.add(post)}const roof=new THREE.Mesh(new THREE.ConeGeometry(2.1,1.5,4),new THREE.MeshLambertMaterial({color:0x63402e}));roof.position.y=2.65;roof.rotation.y=Math.PI/4;g.add(roof);g.position.set(x,groundY(x,z),z);scene.add(g);buildings.push(g)}
function updateSurvivalHud(){document.getElementById('survivalHud').textContent=`❤️ ${Math.ceil(health)}  🍗 ${Math.ceil(hunger)}  🪵 ${inventory.wood}  🪨 ${inventory.stone}  ⛓️ ${inventory.iron||0}  🍖 ${inventory.food}  ✨🍖 ${inventory.shinyMeat||0}  🌀🍖 ${inventory.invertedMeat||0} 🟠 ${inventory.copper||0} 🟡 ${inventory.gold||0} 💎 ${inventory.diamond||0} 🌌 ${inventory.cosmite||0} ⛏ ${gear.pickaxe}:${gear.pickDurability} 🛡 ${gear.armor}:${gear.armorDurability}`}
document.getElementById('gather').onclick=()=>{if(mode!=='survival')return;if(caveMode){mineOre();return;}const player=vrActive?vrRig.position:camera.position;let closest=null,dist=3.1;eachRock(r=>{const d=Math.hypot(r.position.x-player.x,r.position.z-player.z);if(d<dist){dist=d;closest=r}});if(closest){inventory.stone++;const ironFound=(gear.pickDurability>0||hasStonePickaxe||hasIronPickaxe)&&Math.random()<.35;if(gear.pickDurability>0)useGear('pickaxe');if(ironFound)inventory.iron=(inventory.iron||0)+1;minedStones.add(closest.userData.stoneId);closest.parent.remove(closest);notify(ironFound?'⛓️ Iron found! (35% chance)':'🪨 Mined mountain stone!')}else{let tree=null,treeDist=3.1;eachTree(t=>{const d=Math.hypot(t.position.x-player.x,t.position.z-player.z);if(d<treeDist){treeDist=d;tree=t}});if(tree){inventory.wood+=2;choppedTrees.add(tree.userData.treeId);tree.parent.remove(tree);notify('🌳 Collected 2 wood!')}else{notify('Find a tree or mountain rock to gather');return}}updateSurvivalHud();saveGame()};
document.getElementById('eat').onclick=()=>{if(mode!=='survival')return;const choices=[['invertedMeat',60,'🌀 Inverted meat'],['shinyMeat',45,'✨ Shiny meat'],['food',25,'🍖 Meat']];const selected=choices.find(([key])=>(inventory[key]||0)>0);if(!selected){notify('No food!');return}const [key,restore,label]=selected;if(hunger>=100){notify('Hunger is already full');return}inventory[key]--;hunger=Math.min(100,hunger+restore);notify(label+' restored '+restore+' hunger!');updateSurvivalHud();saveGame()};
let pendingRare=null;
const rareWarning=document.getElementById('rareWarning');
function playerPosition(){return vrActive?renderer.xr.getCamera(camera).getWorldPosition(new THREE.Vector3()):camera.position}
function attackAnimal(target,confirmed=false){if(mode!=='survival'||!target||!animals.includes(target))return;if(target.variant!=='normal'&&target.hp<=1&&!confirmed){pendingRare=target;document.getElementById('rareWarningText').textContent=`This ${target.variant} ${target.kind} will be lost if you attack again. Continue?`;rareWarning.style.display='flex';return}target.hp--;if(target.hp>0){notify('⚔️ Hit '+target.kind+'!');return}const key=target.variant==='shiny'?'shinyMeat':target.variant==='inverted'?'invertedMeat':'food';inventory[key]=(inventory[key]||0)+1;scene.remove(target.mesh);animals.splice(animals.indexOf(target),1);notify(target.variant==='normal'?'🍖 Collected meat!':target.variant==='shiny'?'✨ Collected shiny meat!':'🌀 Collected inverted meat!');updateSurvivalHud();updateHud();saveGame()}
document.getElementById('attack').onclick=()=>{if(mode!=='survival'||rareWarning.style.display==='flex')return;if(caveMode){const pos=playerPosition();let target=caveEnemies.find(e=>Math.hypot(e.mesh.position.x-pos.x,e.mesh.position.z-pos.z)<3.5);if(!target){notify('No monster in range');return}target.hp-=gear.pickaxe==='cosmite'?3:1;if(target.hp<=0){caveGroup.remove(target.mesh);caveEnemies.splice(caveEnemies.indexOf(target),1);notify('Monster defeated!')}else notify('⚔️ Hit cave monster');return;}const pos=playerPosition();const forward=new THREE.Vector3();(vrActive?renderer.xr.getCamera(camera):camera).getWorldDirection(forward);forward.y=0;forward.normalize();let best=null,bestDist=3.7;for(const a of animals){if(!a.mesh.visible)continue;const offset=a.mesh.position.clone().sub(pos);offset.y=0;const dist=offset.length();if(dist<bestDist&&dist>.01&&offset.normalize().dot(forward)>.35){best=a;bestDist=dist}}if(best)attackAnimal(best);else notify('No animal in attack range')};
document.getElementById('rareCancel').onclick=()=>{pendingRare=null;rareWarning.style.display='none';notify('Rare animal spared!')};
document.getElementById('rareConfirm').onclick=()=>{const target=pendingRare;pendingRare=null;rareWarning.style.display='none';if(target)attackAnimal(target,true)};

document.getElementById('craft').onclick=()=>{const p=document.getElementById('craftPanel');p.style.display=p.style.display==='none'?'block':'none'};
document.getElementById('closeCraft').onclick=()=>document.getElementById('craftPanel').style.display='none';
const recipes={pickaxe:{wood:3,stone:4},ironpick:{wood:3,iron:3},copperpick:{wood:3,copper:4},goldpick:{wood:3,gold:4},diamondpick:{wood:3,diamond:3},cosmitepick:{wood:3,cosmite:2},stonearmor:{stone:8},ironarmor:{iron:8},diamondarmor:{diamond:6},cosmitearmor:{cosmite:4},shelter:{wood:5,stone:3}};
for(const btn of document.querySelectorAll('[data-recipe]'))btn.onclick=()=>{if(mode!=='survival')return;const recipe=btn.dataset.recipe,cost=recipes[recipe];if(Object.entries(cost).some(([k,n])=>(inventory[k]||0)<n)){notify('Not enough materials');return}for(const [k,n] of Object.entries(cost))inventory[k]-=n;if(recipe==='shelter'){const pos=playerPosition();addShelter(pos.x+3,pos.z-3)}else{const material=recipe==='pickaxe'?'stone':recipe.replace(/pick$|armor$/,'');const type=recipe.endsWith('armor')?'armor':'pickaxe';gear[type]=material;gear[type==='armor'?'armorDurability':'pickDurability']=GEAR[material].max;if(material==='stone')hasStonePickaxe=true;if(material==='iron')hasIronPickaxe=true}notify('Crafted '+recipe+'!');updateSurvivalHud();saveGame()};
document.getElementById('caveToggle').onclick=()=>caveMode?exitCave():enterCave();document.getElementById('mineCave').onclick=mineOre;
function applyMode(){const survival=mode==='survival';document.getElementById('tools').style.display=survival?'none':'flex';document.getElementById('survivalTools').style.display=survival?'flex':'none';document.getElementById('survivalHud').style.display=survival?'block':'none';for(const item of vrButtons){if(['ANIMAL','CUBE','BALL','CLEAR','OWNER','SPECIES','FORCE SHINY','FORCE INVERT'].includes(item.mesh.userData.label))item.mesh.visible=!survival&&!['OWNER','SPECIES','FORCE SHINY','FORCE INVERT'].includes(item.mesh.userData.label)}updateSurvivalHud()}
function openWorld(id){if(gameStarted)saveGame();pendingRare=null;rareWarning.style.display='none';const w=worldList().find(w=>w.id===id);if(!w)return;currentWorld=id;SAVEKEY='sandbox-v1-world-'+id;mode=w.mode;worldSeed=w.seed;for(const a of animals)scene.remove(a.mesh);animals.length=0;for(const b of buildings)scene.remove(b);buildings.length=0;collection={};invertedCollection={};spawnCount=shinyCount=invertedCount=0;health=hunger=100;inventory={wood:0,stone:0,iron:0,food:2,shinyMeat:0,invertedMeat:0};minedStones.clear();choppedTrees.clear();hasStonePickaxe=false;hasIronPickaxe=false;gear={pickaxe:'none',pickDurability:0,armor:'none',armorDurability:0};caveMined=new Set();if(caveMode)exitCave();dayPhase=.3;lastChunkX=Infinity;lastChunkZ=Infinity;for(const m of terrainChunks.values()){scene.remove(m);scene.remove(m.userData.rocks);scene.remove(m.userData.trees);scene.remove(m.userData.water);m.userData.rocks.clear();m.userData.trees.clear();m.userData.water.geometry.dispose();m.geometry.dispose()}terrainChunks.clear();try{const saved=localStorage.getItem(SAVEKEY);if(saved)loadGame(JSON.parse(saved))}catch(e){notify('Could not load world')};camera.position.set(0,groundY(0,6)+1.7,6);gameStarted=true;document.getElementById('mainMenu').style.display='none';applyMode();updateHud()}
function refreshWorlds(){const el=document.getElementById('worldList');el.replaceChildren();for(const w of worldList()){const row=document.createElement('div');const play=document.createElement('button');play.textContent=(w.mode==='survival'?'🌲 ':'🎨 ')+w.name;play.onclick=()=>openWorld(w.id);row.appendChild(play);const del=document.createElement('button');del.textContent='🗑';del.title='Delete world';del.onclick=()=>{if(!confirm('Delete '+w.name+' permanently?'))return;localStorage.removeItem('sandbox-v1-world-'+w.id);writeWorldList(worldList().filter(v=>v.id!==w.id));refreshWorlds()};row.appendChild(del);el.appendChild(row)}}
function createWorld(selectedMode){const name=document.getElementById('worldName').value.trim()||'New World',seedText=document.getElementById('worldSeed').value.trim();const seed=seedText?[...seedText].reduce((h,c)=>(Math.imul(h,31)+c.charCodeAt(0))|0,7):Math.floor(Math.random()*100000000);const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);const list=worldList();list.push({id,name,mode:selectedMode,seed});writeWorldList(list);refreshWorlds();openWorld(id)}
document.getElementById('createSurvival').onclick=()=>createWorld('survival');document.getElementById('createCreative').onclick=()=>createWorld('creative');document.getElementById('menuButton').onclick=()=>{saveGame();refreshWorlds();document.getElementById('mainMenu').style.display='flex'};refreshWorlds();
function updateCaveEnemies(dt){if(!caveMode)return;const pos=playerPosition();caveClock+=dt;for(const e of caveEnemies){const d=Math.hypot(pos.x-e.mesh.position.x,pos.z-e.mesh.position.z);if(d>1.5&&d<14){e.mesh.position.x+=(pos.x-e.mesh.position.x)/d*dt*.8;e.mesh.position.z+=(pos.z-e.mesh.position.z)/d*dt*.8}if(d<1.7&&caveClock-e.lastHit>2&&mode==='survival'){e.lastHit=caveClock;const protectedHit=gear.armorDurability>0;if(protectedHit)useGear('armor');health=Math.max(1,health-(protectedHit?3:9));notify('⚠️ Cave monster attacked!');updateSurvivalHud()}}}
function updateAnimals(dt){const player=vrActive?vrRig.position:camera.position;for(const a of animals){
 a.mesh.visible=!caveMode&&Math.abs(a.mesh.position.x-player.x)<CHUNK*1.55&&Math.abs(a.mesh.position.z-player.z)<CHUNK*1.55;
 if(!a.mesh.visible)continue;
 a.turnTimer-=dt;if(a.turnTimer<=0){a.heading+=(Math.random()-.5)*1.8;a.turnTimer=1+Math.random()*3}
 a.mesh.rotation.y=a.heading;
 const step=a.speed*dt,nx=a.mesh.position.x-Math.sin(a.heading)*step,nz=a.mesh.position.z-Math.cos(a.heading)*step;
 const aquatic=waterSpecies.includes(a.kind),height=groundY(nx,nz);
 // Water creatures stay in water; land creatures stop at the shoreline.
 const allowed=aquatic?height<WATER_LEVEL-.25:height>=WATER_LEVEL+.12;
 if(allowed){a.mesh.position.x=nx;a.mesh.position.z=nz}else{a.heading+=Math.PI*.7;a.turnTimer=.3}
 a.phase+=dt*7;
 a.mesh.position.y=aquatic?Math.min(WATER_LEVEL-.85,groundY(a.mesh.position.x,a.mesh.position.z)+.2)+Math.sin(a.phase*.4)*.12:groundY(a.mesh.position.x,a.mesh.position.z);
 for(let i=0;i<a.legs.length;i++)a.legs[i].rotation.x=Math.sin(a.phase+(i%2===0?0:Math.PI))*.35;
}}

let yaw=0,pitch=0,moveX=0,moveY=0,vertical=0;const keys={};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='f'&&gameStarted)document.getElementById('attack').click()});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
const stick=document.getElementById('stick'),nub=document.getElementById('nub');
function stickMove(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.max(1,Math.hypot(dx,dy)),dist=Math.min(42,len);moveX=dx/len*dist/42;moveY=dy/len*dist/42;nub.style.transform=`translate(${moveX*42}px,${moveY*42}px)`}
stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))stickMove(e)});function reset(){moveX=moveY=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',reset);stick.addEventListener('pointercancel',reset);
let lookId=null,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(lookId!==null)return;lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;yaw-=(e.clientX-lastX)*.004;pitch-=(e.clientY-lastY)*.004;pitch=THREE.MathUtils.clamp(pitch,-1.5,1.5);lastX=e.clientX;lastY=e.clientY});function stopLook(e){if(e.pointerId===lookId)lookId=null}renderer.domElement.addEventListener('pointerup',stopLook);renderer.domElement.addEventListener('pointercancel',stopLook);
function jump(){if(vrActive)return;const floor=caveMode?1.7:Math.max(groundY(camera.position.x,camera.position.z),WATER_LEVEL-1)+1.7;if(camera.position.y<=floor+0.08&&vertical<=0)vertical=5}document.getElementById('jump').addEventListener('pointerdown',jump);
function vrInput(dt){
 const session=renderer.xr.getSession();if(!session)return;
 const left=[...session.inputSources].find(s=>s.handedness==='left'&&s.gamepad);
 if(left){const axes=left.gamepad.axes;let x=axes.length>=4?axes[2]:axes[0],y=axes.length>=4?axes[3]:axes[1];
 // Some Quest mappings expose the thumbstick on axes 0/1.
 if(axes.length>=4&&Math.abs(x)+Math.abs(y)<.08&&Math.abs(axes[0])+Math.abs(axes[1])>.2){x=axes[0];y=axes[1]}
 x=Math.abs(x)<.18?0:x;y=Math.abs(y)<.18?0:y;
 const head=renderer.xr.getCamera(camera);const forward=new THREE.Vector3();head.getWorldDirection(forward);forward.y=0;forward.normalize();
 if(forward.lengthSq()<.1)forward.set(0,0,-1);
 const right=new THREE.Vector3(-forward.z,0,forward.x);
 walkTo(vrRig.position,(right.x*x-forward.x*y)*3*dt,(right.z*x-forward.z*y)*3*dt);vrRig.position.y=groundY(vrRig.position.x,vrRig.position.z);
 }
 // Right thumbstick is deliberately unused to avoid drift.
}

let prev=performance.now();function loop(now){const dt=Math.min((now-prev)/1000,.05);prev=now;if(!gameStarted){renderer.render(scene,camera);return;}updateDay(dt);spawnClock+=dt;survivalClock+=dt;if(spawnClock>5&&!caveMode){spawnClock=0;const normalCount=animals.filter(a=>a.variant==='normal').length;if(normalCount<18)spawnAnimal(null,null,true);else if(normalCount>12){const old=animals.find(a=>a.variant==='normal'&&a.mesh.position.distanceTo(vrActive?vrRig.position:camera.position)>38);if(old){scene.remove(old.mesh);animals.splice(animals.indexOf(old),1)}}}if(mode==='survival'&&survivalClock>6){survivalClock=0;hunger=Math.max(0,hunger-1);if(hunger===0)health=Math.max(0,health-2);if(health===0){notify('You fainted! Respawning');health=100;hunger=50;camera.position.set(0,groundY(0,6)+1.7,6)}updateSurvivalHud()}const player=vrActive?vrRig.position:camera.position;if(!caveMode)updateChunks(player.x,player.z);if(vrActive){vrInput(dt);if(vrNoticeMesh.visible&&performance.now()>vrNoticeUntil)vrNoticeMesh.visible=false;for(const o of objects){o.vy-=13*dt;o.mesh.position.y+=o.vy*dt;if(o.mesh.position.y<groundY(o.mesh.position.x,o.mesh.position.z)+o.r){o.mesh.position.y=groundY(o.mesh.position.x,o.mesh.position.z)+o.r;o.vy=Math.abs(o.vy)<.6?0:-o.vy*.45}}if(!caveMode)updateAnimals(dt);updateCaveEnemies(dt);updateParticles(dt);renderer.render(scene,camera);return;}const side=moveX+(keys.d?1:0)-(keys.a?1:0),forward=-moveY+(keys.w?1:0)-(keys.s?1:0);const length=Math.max(1,Math.hypot(side,forward));const speed=6*dt/length;walkTo(camera.position,(Math.cos(yaw)*side-Math.sin(yaw)*forward)*speed,(-Math.sin(yaw)*side-Math.cos(yaw)*forward)*speed);vertical-=13*dt;camera.position.y+=vertical*dt;if(camera.position.y<(caveMode?1.7:groundY(camera.position.x,camera.position.z)+1.7)){camera.position.y=caveMode?1.7:groundY(camera.position.x,camera.position.z)+1.7;vertical=0}if(!caveMode&&groundY(camera.position.x,camera.position.z)<WATER_LEVEL){vertical=Math.max(vertical,-1.3);camera.position.y=Math.max(camera.position.y,WATER_LEVEL+.55)}if(keys[' ']){keys[' ']=false;jump()}camera.rotation.y=yaw;camera.rotation.x=pitch;for(const o of objects){o.vy-=13*dt;o.mesh.position.y+=o.vy*dt;if(o.mesh.position.y<groundY(o.mesh.position.x,o.mesh.position.z)+o.r){o.mesh.position.y=groundY(o.mesh.position.x,o.mesh.position.z)+o.r;o.vy=Math.abs(o.vy)<.6?0:-o.vy*.45}o.mesh.rotation.x+=dt*.4;o.mesh.rotation.z+=dt*.25}if(!caveMode)updateAnimals(dt);updateCaveEnemies(dt);updateParticles(dt);renderer.render(scene,camera)}renderer.setAnimationLoop(loop);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
